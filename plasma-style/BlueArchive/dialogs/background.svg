  </g>
  <rect id="center" fill="#ffffff" fill-opacity="0.97" x="8" y="8" width="10" height="10"/>
  <g id="right">
    <rect fill="#ffffff" fill-opacity="0.97" x="18" y="8" width="7" height="10"/>
    <rect fill="#a8d8fa" x="25" y="8" width="1" height="10"/>
  </g>
  <g id="bottomleft">
    <path fill="#ffffff" fill-opacity="0.97" d="M1,18 A7,7 0 0 0 8,25 L8,18 Z"/>
    <path fill="#a8d8fa" fill-rule="evenodd" d="M0,18 A8,8 0 0 0 8,26 L8,18 Z M1,18 A7,7 0 0 0 8,25 L8,18 Z"/>
  </g>
  <g id="bottom">
    <rect fill="#ffffff" fill-opacity="0.97" x="8" y="18" width="10" height="7"/>
    <rect fill="#a8d8fa" x="8" y="25" width="10" height="1"/>
  </g>
  <g id="bottomright">
    <path fill="#ffffff" fill-opacity="0.97" d="M25,18 A7,7 0 0 1 18,25 L18,18 Z"/>
    <path fill="#a8d8fa" fill-rule="evenodd" d="M26,18 A8,8 0 0 1 18,26 L18,18 Z M25,18 A7,7 0 0 1 18,25 L18,18 Z"/>
