<?xml version="1.0" encoding="UTF-8"?>
<!-- Blue Archive popup frame: white bezel, Kivotos-blue top edge. 8px corners, 10px stretchable middle. -->
<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 26 26">
  <g id="topleft">
    <path fill="#ffffff" fill-opacity="0.97" d="M1,8 A7,5 0 0 1 8,3 L8,8 Z"/>
    <path fill="#2ca0f0" fill-rule="evenodd" d="M0,8 A8,8 0 0 1 8,0 L8,8 Z M1,8 A7,5 0 0 1 8,3 L8,8 Z"/>
  </g>
  <g id="top">
    <rect fill="#2ca0f0" x="8" y="0" width="10" height="3"/>
    <rect fill="#ffffff" fill-opacity="0.97" x="8" y="3" width="10" height="5"/>
  </g>
  <g id="topright">
    <path fill="#ffffff" fill-opacity="0.97" d="M18,3 A7,5 0 0 1 25,8 L18,8 Z"/>
    <path fill="#2ca0f0" fill-rule="evenodd" d="M18,0 A8,8 0 0 1 26,8 L18,8 Z M18,3 A7,5 0 0 1 25,8 L18,8 Z"/>
  </g>
  <g id="left">
    <rect fill="#a8d8fa" x="0" y="8" width="1" height="10"/>
